# Dependabot configuration
#
# Goal: keep dependencies patched with as little notification noise as possible.
# - Version updates run monthly and are batched into a single PR per ecosystem.
# - Security fixes are batched into a single PR per ecosystem (requires
#   "Grouped security updates" to be enabled in Settings > Code security).
# - Major version bumps are ignored for version updates; they need a manual
#   migration and would otherwise break the grouped PR.
# - cooldown skips releases younger than 7 days (fewer follow-up patch PRs).
version: 2

updates:
  - package-ecosystem: npm
    directory: /src/affectlog/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "fix(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "fix(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-minor-patch:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /src/affectlog/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
